image: Dockerfile

ports:
  - port: 8080
    visibility: public
    onOpen: open-preview

tasks:
  - init: |
      wget https://github.com/quarto-dev/quarto-cli/releases/download/v1.7.13/quarto-1.7.13-linux-amd64.tar.gz &&
      mkdir ~/opt &&
      tar -C ~/opt -xvzf quarto-1.7.13-linux-amd64.tar.gz &&
      mkdir ~/bin &&
      ln -s ~/opt/quarto-1.7.13/bin/quarto ~/bin/quarto &&
      echo -e "\nexport PATH=\$PATH:~/bin\n" >> ~/.profile &&
      source ~/.profile

      if [ -f ~/bin/quarto ]; then
        echo "Quarto installed successfully at ~/bin/quarto"
      else
        echo "Error: Quarto not found in ~/bin!"
      fi

      quarto --version
      r --version
      tex --version
      inkscape --version
      gs --version

      quarto check &&
      quarto install tinytex &&
      quarto install chromium

      quarto render --to html

      mv _book public

      apachectl start
