tasks:
  - init: |
      echo "📦 Installing system dependencies..."
      sudo apt-get update
      sudo apt-get install -y r-base
      sudo apt-get install -y texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra
      sudo apt-get install -y texlive-pictures texlive-luatex
      sudo apt-get install -y ghostscript
      sudo apt-get install -y inkscape

      echo "📥 Installing Quarto..."
      wget https://github.com/quarto-dev/quarto-cli/releases/download/v1.7.13/quarto-1.7.13-linux-amd64.deb
      sudo dpkg -i quarto-1.7.13-linux-amd64.deb

      echo "📦 Installing R packages..."
      Rscript -e "install.packages('remotes', repos='http://cran.us.r-project.org')"
      Rscript -e "install.packages('knitr', repos='http://cran.us.r-project.org')"  # Installing knitr explicitly
      Rscript -e "install.packages('rmarkdown', repos='http://cran.us.r-project.org')"  # Installing rmarkdown explicitly
      Rscript install_packages.R  # Continue with custom R packages from install_packages.R

      echo "📦 Installing TinyTeX..."
      quarto install tinytex

      echo "✅ Checking installed versions..."
      quarto check
      quarto --version
      R --version
      tex --version
      inkscape --version
      gs --version

      # Create the 'public' folder and set write permissions
      echo "📂 Creating 'public' folder and setting write permissions..."
      mkdir -p /workspace/public
      sudo chmod 777 /workspace/public  # Giving full read/write/execute permissions to all users

      # Check if Rscript is in the PATH
      echo "🔍 Checking if '/usr/bin/Rscript' is in the PATH..."
      which Rscript

      # List installed R packages
      echo "📦 Listing installed R packages..."
      Rscript -e "installed.packages()"

      # Optional: Render HTML to public folder (you can uncomment this later if you want)
      # quarto render --to html --output-dir public

    command: |
      echo "✨ To build HTML: quarto render --to html --output-dir public"
      echo "🖨️  To build PDF:  quarto render --to titlepage-pdf"
      echo "📉 To compress PDF: python3 ./scripts/quarto_publish/gs_compress_pdf.py"

ports:
  - port: 8080
    visibility: public
    onOpen: open-browser
