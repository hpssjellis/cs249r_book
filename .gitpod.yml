image:
  file: .gitpod.Dockerfile

ports:
  - port: 8080
    visibility: public
    onOpen: open-browser

tasks:
  - init: |
      quarto check &&
      quarto --version &&
      R --version &&
      tex --version &&
      inkscape --version &&
      gs --version &&
      quarto render --to html &&
      mv _book public

  - command: apachectl -D FOREGROUND

