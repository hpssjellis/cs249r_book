ports:
- port: 8080  
  visibility: public
  onOpen: open-preview

tasks:
- init:       ( echo ""; echo 'export PATH=$PATH:~/bin\n' ; echo "" ) >> ~/.profile                                        &&       
              source ~/.profile                                                                                            &&
              quarto check                                                                                                 &&
              quarto render                                                                                                &&
              mv _book public                                                                                              &&
              apachectl start  
