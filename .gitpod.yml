image:
  file: .gitpod.Dockerfile
  
ports:
- port: 8080  
  visibility: public
  onOpen: open-preview

tasks:
  - init: quarto check             &&
      quarto --version             &&
      r --version                  &&
      tex --version                &&
      inkscape --version           &&
      gs --version                 &&
      quarto install chromium      &&     
      quarto render --to html      &&
      mv _book public              &&
      apachectl start 
